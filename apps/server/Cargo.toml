[package]
name = "undertone-cli-server"
version = "0.1.0"
authors = ["Victoria Beauray Sagady <cephypi@pm.me>"]
license = "AGPL-3.0"
description = "Undertone voice chat server run from the command line."
publish = false
edition = "2024"

[dependencies]
undertone-serialization.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-postgres = "0.7.17"
ractor = "0.15.12"
serde = { version = "1.0", features = ["derive"]}
config = "0.15"
thiserror.workspace = true

[dev-dependencies]
# Only used for testing.
serde_json = "1.0"
toml = "1.1"
serde-saphyr = "0.0.25"
ron = "0.12"
