[package]
name = "undertone-client"
version = "0.1.0"
description = "Undertone Client"
authors = ["Victoria Beauray Sagady <cephypi@pm.me>"]
edition = "2024"

[profile.dev]
incremental = true # Compile binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization
lto = true # Enables link-time-optimization
opt-level = "s" # Prioritize small binary size. Use '3' if you prefer speed.
panic = "abort" # High performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "undertone_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta", "tracing"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
taurpc = "0.7.1"
specta = { version = "=2.0.0-rc.22", features= ["derive"] }
