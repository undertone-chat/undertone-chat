[workspace]
resolver = "3"
members = ["crates/undertone-serialization", "apps/server", "apps/client"]

[workspace.package]
version = "0.1.0"
authors = ["Victoria Beauray Sagady"]
readme = "README.md"
license-file = "LICENSE.md"
edition = "2024"
homepage = "https://github.com/undertone-chat/undertone-chat"
license = "ULv1"
publish = false
repository = "https://github.com/undertone-chat/undertone-chat"

[workspace.dependencies]
log = "0.4.29"
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.18"
tokio = {version="1.52.0" , features=["full"]}
undertone-serialization = { path = "crates/undertone-serialization"}
chrono = {version="0.4.44", features=["rkyv-32"]}
